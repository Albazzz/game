<html lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}::-webkit-scrollbar{display:none;}</style><link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"on-primary-fixed":"#001c39","on-error":"#ffffff","inverse-surface":"#2c3134","on-secondary":"#ffffff","surface-container-lowest":"#ffffff","on-surface-variant":"#414752","surface-container":"#e9eff2","on-primary":"#ffffff","surface-variant":"#dee3e6","on-secondary-fixed":"#2d1600","on-surface":"#171c1f","surface-container-low":"#eff4f7","surface-tint":"#0060ac","secondary-fixed-dim":"#ffb874","on-tertiary-container":"#fcfcff","secondary":"#8c5000","surface-container-highest":"#dee3e6","on-secondary-fixed-variant":"#6a3b00","surface-bright":"#f5fafd","primary-fixed":"#d4e3ff","tertiary-container":"#007dac","secondary-fixed":"#ffdcbf","tertiary":"#006389","on-secondary-container":"#683a00","error":"#ba1a1a","surface-container-high":"#e4e9ec","background":"#f5fafd","surface":"#f5fafd","on-background":"#171c1f","inverse-on-surface":"#ecf1f4","primary-container":"#1976cd","on-primary-fixed-variant":"#004883","error-container":"#ffdad6","surface-dim":"#d6dbde","on-primary-container":"#fdfcff","outline":"#717783","on-tertiary-fixed-variant":"#004c6b"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-desktop":"40px","margin-mobile":"20px","unit":"8px","panel-padding":"24px","gutter":"16px"},"fontFamily":{"body-md":["Noto Sans"],"display-xl-mobile":["Anton"],"label-caps":["Anton"],"body-lg":["Noto Sans"],"display-lg":["Anton"],"headline-md":["Noto Sans"],"headline-sm":["Noto Sans"],"display-xl":["Anton"]},"fontSize":{"body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],"display-xl-mobile":["40px",{"lineHeight":"1.1","fontWeight":"400"}],"label-caps":["14px",{"lineHeight":"1","letterSpacing":"0.05em","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"1.5","fontWeight":"500"}],"display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"0.02em","fontWeight":"400"}],"headline-md":["32px",{"lineHeight":"1.2","fontWeight":"700"}],"headline-sm":["24px",{"lineHeight":"1.2","fontWeight":"700"}],"display-xl":["64px",{"lineHeight":"1.1","letterSpacing":"0.02em","fontWeight":"400"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface flex items-center justify-center min-h-screen"><main class="w-full max-w-md"><div class="flex flex-col w-full relative min-h-[600px] overflow-hidden items-center justify-center p-gutter">
<!-- Ambient Background -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-bright via-primary-fixed to-surface-tint opacity-80 mix-blend-multiply pointer-events-none"></div>
<!-- Snow Particles (Decorative mid-layer) -->
<div class="absolute inset-0 z-10 pointer-events-none overflow-hidden" id="snow-container">
<!-- Snow particles injected via JS -->
</div>
<!-- Background Decoration SVG (Cat Paw / Snowflake Hybrid) -->
<svg class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] text-on-primary-fixed opacity-5 z-0 pointer-events-none" fill="currentColor" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="10"></circle>
<circle cx="50" cy="20" r="8"></circle>
<circle cx="20" cy="40" r="8"></circle>
<circle cx="80" cy="40" r="8"></circle>
<path d="M50 30 L50 40 M30 40 L40 45 M70 40 L60 45" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
<!-- Starbursts -->
<path d="M50 5 L50 15 M50 85 L50 95 M5 50 L15 50 M85 50 L95 50" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
<!-- Glassmorphic Error Card -->
<div class="relative z-20 w-full max-w-[560px] bg-surface/90 backdrop-blur-[20px] rounded-[24px] p-panel-padding shadow-2xl flex flex-col items-center text-center border-[3px] border-on-primary transition-all duration-500 hover:scale-[1.01]" id="error-card">
<!-- State Container -->
<div class="w-full relative min-h-[300px] flex flex-col items-center justify-center">
<!-- Default Visible State (Generic Error) -->
<div class="flex flex-col items-center opacity-100 transition-opacity duration-300 absolute inset-0 pt-8 pb-4" id="state-generic">
<div class="w-24 h-24 mb-6 rounded-full bg-error-container text-on-error-container flex items-center justify-center border-4 border-on-primary shadow-lg relative overflow-hidden group">
<span class="material-symbols-outlined text-[48px] transform group-hover:scale-110 transition-transform duration-300" style="font-variation-settings: 'FILL' 1;">warning</span>
<div class="absolute inset-0 bg-white/20 animate-pulse mix-blend-overlay"></div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Đã Xảy Ra Lỗi</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[400px] mb-8">
                    Phiên truy cập hoặc dịch vụ vừa gặp sự cố. Hãy quay về sảnh và thử lại.
                </p>
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center px-4">
<button class="flex-1 bg-surface-tint text-on-primary font-label-caps text-label-caps py-4 px-6 rounded-full border-[3px] border-on-primary shadow-md hover:-translate-y-1 hover:shadow-lg transition-all duration-200 active:translate-y-0 relative overflow-hidden group" onclick="switchState('loading')">
<span class="relative z-10 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                            Thử lại
                        </span>
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<button class="flex-1 bg-gradient-to-b from-[#fe9c2d] to-[#8c5000] text-on-primary font-label-caps text-label-caps py-4 px-6 rounded-full border-[3px] border-on-primary border-b-[5px] shadow-md hover:-translate-y-1 hover:shadow-lg transition-all duration-200 active:translate-y-0 active:border-b-[3px] relative overflow-hidden group">
<span class="relative z-10 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">home</span>
                            Về sảnh game
                        </span>
<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
</div>
<!-- 404 State (Hidden by default) -->
<div class="flex flex-col items-center opacity-0 pointer-events-none transition-opacity duration-300 absolute inset-0 pt-8 pb-4" id="state-404">
<div class="w-24 h-24 mb-6 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center border-4 border-on-primary shadow-lg relative overflow-hidden">
<span class="material-symbols-outlined text-[48px] animate-[bounce_2s_infinite]" style="font-variation-settings: 'FILL' 1;">search_off</span>
</div>
<h1 class="font-display-xl text-display-xl text-secondary mb-1">404</h1>
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Không thể mở trang này</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[360px] mb-8">
                    Đường dẫn không tồn tại hoặc đã được thay đổi.
                </p>
<button class="bg-gradient-to-b from-[#fe9c2d] to-[#8c5000] text-on-primary font-label-caps text-label-caps py-4 px-8 rounded-full border-[3px] border-on-primary border-b-[5px] shadow-md hover:-translate-y-1 hover:shadow-lg transition-all duration-200 active:translate-y-0 active:border-b-[3px]" onclick="switchState('generic')">
                     Về sảnh game
                </button>
</div>
<!-- Loading State (Hidden by default) -->
<div class="flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 absolute inset-0" id="state-loading">
<!-- Snowball Spinner -->
<div class="relative w-20 h-20 mb-6">
<div class="absolute inset-0 rounded-full border-[4px] border-surface-variant"></div>
<div class="absolute inset-0 rounded-full border-[4px] border-primary border-t-transparent animate-spin"></div>
<div class="absolute inset-0 flex items-center justify-center text-primary">
<span class="material-symbols-outlined animate-pulse" style="font-variation-settings: 'FILL' 1;">ac_unit</span>
</div>
</div>
<p class="font-label-caps text-label-caps text-primary tracking-widest animate-pulse">ĐANG KẾT NỐI LẠI...</p>
<!-- Cancel button for demo purposes to switch back -->
<button class="mt-8 text-on-surface-variant font-body-md text-body-md underline hover:text-on-surface transition-colors" onclick="switchState('404')">
                    Hủy (Mô phỏng 404)
                </button>
</div>
</div>
</div>
</div>
<script>
    // Simple state switcher for demonstration
    function switchState(targetStateId) {
        const states = ['generic', '404', 'loading'];
        
        states.forEach(state => {
            const el = document.getElementById(`state-${state}`);
            if (state === targetStateId) {
                el.classList.remove('opacity-0', 'pointer-events-none');
                el.classList.add('opacity-100');
            } else {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0', 'pointer-events-none');
            }
        });
    }

    // Snow particle generator
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('snow-container');
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            
            // Random properties
            const size = Math.random() * 4 + 2; // 2px to 6px
            const left = Math.random() * 100; // 0% to 100%
            const duration = Math.random() * 10 + 5; // 5s to 15s
            const delay = Math.random() * -15; // Random start time
            const opacity = Math.random() * 0.5 + 0.2;

            particle.className = 'absolute rounded-full bg-white blur-[1px]';
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${left}%`;
            particle.style.top = `-10px`;
            particle.style.opacity = opacity;
            
            // Basic CSS animation applied inline
            particle.animate([
                { transform: 'translateY(0vh) translateX(0px)', opacity: opacity },
                { transform: `translateY(110vh) translateX(${Math.random() * 100 - 50}px)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                iterations: Infinity,
                delay: delay * 1000,
                easing: 'linear'
            });

            container.appendChild(particle);
        }
    });
</script></main></body></html>
