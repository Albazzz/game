# ===== Server =====
server.port=${JLAS_GAME_PORT:8080}
spring.application.name=J-LAS Game Arena
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===== Database (MySQL) =====
# Dùng DB riêng cho Game Arena, KHÔNG chạm vào jlas_db của app học tập.
spring.datasource.url=jdbc:mysql://localhost:3306/jlas_game_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=loc
spring.datasource.password=123123*A
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== JWT =====
# Production: set env JLAS_GAME_JWT_SECRET (>= 256 bit).
app.jwt.secret=${JLAS_GAME_JWT_SECRET:GameArenaDevOnlySecretKeyForJwtMustBeAtLeast256BitsLong2026!!}
app.jwt.access-token-expiration-ms=86400000

# ===== Google Sign-In =====
# Lấy OAuth 2.0 Client ID (loại Web application) ở Google Cloud Console.
# Authorized JavaScript origins: http://localhost:8080
# Để trống -> nút Google tự ẩn, chỉ còn login bằng email/mật khẩu.
# Client secret KHÔNG cần: luồng Google Identity Services chỉ verify ID token.
app.google.client-id=${JLAS_GAME_GOOGLE_CLIENT_ID:}

# ===== Game Arena runtime =====
# Countdown do server phát, client chỉ render theo startAt.
game.arena.countdown-seconds=3
# Grace period khi mất kết nối (p1.md: 20-30s).
game.arena.reconnect-grace-seconds=25
# Room WAITING quá hạn sẽ bị dọn.
game.arena.room-idle-timeout-minutes=30
game.arena.max-rooms=5000
game.arena.sweep-interval-ms=15000
# Rate limit action WebSocket (số lần / phút / user).
game.arena.rate-limit.ready-per-minute=40
game.arena.rate-limit.settings-per-minute=60
game.arena.rate-limit.start-per-minute=15
game.arena.rate-limit.join-per-minute=30
game.arena.rate-limit.answer-per-minute=180
# Chặn payload WS quá lớn.
game.arena.max-ws-payload-bytes=8192

# ===== Demo seed (chỉ dùng cho local demo 2 tab browser) =====
game.demo.seed-enabled=true
game.demo.password=${JLAS_GAME_DEMO_PASSWORD:demo1234}
# Tài khoản ADMIN cho /api/admin/arena/** — đổi mật khẩu bằng env khi deploy.
game.demo.admin-email=${JLAS_GAME_ADMIN_EMAIL:admin@jlas.local}
game.demo.admin-password=${JLAS_GAME_ADMIN_PASSWORD:admin1234}

# ===== Logging =====
logging.level.admin.jlas.game=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.socket=WARN

# Có DaoAuthenticationProvider bean tường minh là cố ý (cần PasswordEncoder riêng),
# nên tắt cảnh báo "UserDetailsService beans will not be used" khi boot.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
