<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lobby · Game Arena</title>
    <link rel="stylesheet" th:href="@{/arena/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/arena/css/base.css}">
    <link rel="stylesheet" th:href="@{/arena/css/lobby.css}">
</head>
<body class="lobby-page">
<nav th:replace="~{fragments/layout :: nav('lobby')}"></nav>

<main class="lobby-shell">
    <div class="lobby-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="lobby-layout">
        <div class="lobby-actions">
            <section class="lobby-card lobby-card--create">
                <div class="lobby-card__accent"></div>
                <div class="lobby-card__heading"><span aria-hidden="true">✚</span><div><span class="lobby-card__eyebrow">Bắt đầu ngay</span><h2>Tạo phòng</h2></div></div>
                <form class="lobby-form" data-create-form>
                    <div class="field"><label class="field__label" for="lobby-game">Chế độ chơi</label><select class="select" id="lobby-game" name="gameType"></select></div>
                    <div class="lobby-form__row">
                        <div class="field"><label class="field__label" for="lobby-level">Cấp độ</label><select class="select" id="lobby-level" name="questionLevel"><option value="N5">N5</option><option value="N4">N4</option><option value="N3">N3</option><option value="N2">N2</option><option value="N1">N1</option></select></div>
                        <div class="field"><label class="field__label" for="lobby-visibility">Quyền riêng tư</label><select class="select" id="lobby-visibility" name="visibility"><option value="PUBLIC">Công khai</option><option value="PRIVATE">Riêng tư</option></select></div>
                    </div>
                    <button type="submit" class="lobby-btn lobby-btn--warm"><span aria-hidden="true">🚀</span> Tạo phòng</button>
                </form>
            </section>

            <section class="lobby-card lobby-card--join">
                <div class="lobby-card__heading"><span aria-hidden="true">⌕</span><div><span class="lobby-card__eyebrow">Bạn đã có lời mời?</span><h2>Vào bằng mã phòng</h2></div></div>
                <form class="lobby-join-form" data-join-form>
                    <label class="sr-only" for="lobby-code">Mã phòng</label>
                    <input class="input input--code" id="lobby-code" name="roomCode" maxlength="9" placeholder="Nhập mã phòng…" autocomplete="off">
                    <button type="submit" class="lobby-btn lobby-btn--ice">Vào phòng <span aria-hidden="true">➜</span></button>
                </form>
            </section>
        </div>

        <section class="lobby-card lobby-card--rooms">
            <div class="lobby-card__heading lobby-card__heading--rooms">
                <div><span class="lobby-card__eyebrow">Đang hoạt động</span><h2>Phòng công khai</h2></div>
                <button type="button" class="lobby-refresh" data-refresh-rooms><span aria-hidden="true">↻</span> Làm mới</button>
            </div>
            <div class="lobby-room-list" data-room-list>
                <div class="state"><div class="spinner" aria-hidden="true"></div><p>Đang tải danh sách phòng…</p></div>
            </div>
            <div class="lobby-empty-tip"><span aria-hidden="true">❄</span> Phòng công khai sẽ xuất hiện ở đây khi có người mở phòng.</div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: toast}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/arena/js/lobby-page.js}"></script>
</body>
</html>
